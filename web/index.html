<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vehicle Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Garage">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#efe8dc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Rin, the garage mascot: an original character drawn for this app -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rin-hair" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b2b2e"/><stop offset=".6" stop-color="#151515"/><stop offset=".86" stop-color="#1c1c1c"/><stop offset="1" stop-color="#c1272d"/>
      </linearGradient>
      <linearGradient id="rin-bangs" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a3a3e"/><stop offset=".7" stop-color="#1a1a1c"/><stop offset="1" stop-color="#111"/>
      </linearGradient>
      <linearGradient id="rin-iris" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a0c0c"/><stop offset=".45" stop-color="#7a1418"/><stop offset=".8" stop-color="#c1272d"/><stop offset="1" stop-color="#f08a7a"/>
      </linearGradient>
      <linearGradient id="rin-lens" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f3c9c3"/><stop offset=".5" stop-color="#c1272d"/><stop offset="1" stop-color="#5a0d10"/>
      </linearGradient>
      <clipPath id="rin-eye-l"><ellipse cx="94" cy="143" rx="14" ry="17"/></clipPath>
      <clipPath id="rin-eye-r"><ellipse cx="146" cy="143" rx="14" ry="17"/></clipPath>
    </defs>
    <symbol id="rin" viewBox="0 0 240 300">
      <g stroke="#151515" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <!-- long back hair with pink tips -->
        <path d="M52 112 Q44 40 120 30 Q196 40 188 112 L198 232 Q182 252 160 238 L168 172 L72 172 L80 238 Q58 252 42 232 Z" fill="url(#rin-hair)"/>
        <!-- racing jacket -->
        <path d="M34 300 Q40 240 92 222 L120 238 L148 222 Q200 240 206 300 Z" fill="#161616"/>
        <path d="M56 300 Q60 256 90 236 L97 243 Q72 262 70 300 Z M184 300 Q180 256 150 236 L143 243 Q168 262 170 300 Z" fill="#c1272d"/>
        <path d="M110 300 L104 250 L120 238 L136 250 L130 300 Z" fill="#f2f2f7"/>
        <path d="M92 222 L104 252 L120 238 Z M148 222 L136 252 L120 238 Z" fill="#262626"/>
        <rect x="146" y="264" width="32" height="14" rx="1" fill="#efe8dc" stroke-width="1.6"/>
        <circle cx="72" cy="272" r="9" fill="#c1272d" stroke="none"/>
        <!-- spanner over her shoulder -->
        <g transform="rotate(28 200 230)">
          <rect x="194" y="178" width="12" height="96" rx="4" fill="#c9ced6"/>
          <path d="M186 180 Q186 158 200 156 Q214 158 214 180 L207 182 L207 170 L193 170 L193 182 Z" fill="#c9ced6"/>
          <path d="M197 190 L197 262" stroke="#fff" stroke-width="2" opacity=".6"/>
        </g>
        <!-- neck with cel shadow -->
        <path d="M106 192 L106 226 Q120 236 134 226 L134 192 Z" fill="#fbe7d8"/>
        <path d="M106 196 Q120 214 134 196 L134 208 Q120 222 106 208 Z" fill="#f2bfae" stroke="none"/>
        <!-- ears + face -->
        <path d="M62 118 Q62 64 120 60 Q178 64 178 118 Q178 150 160 172 Q140 196 120 202 Q100 196 80 172 Q62 150 62 118 Z" fill="#fbe7d8"/>
        <path d="M66 102 Q120 118 174 102 L174 116 Q120 132 66 116 Z" fill="#efc6b0" stroke="none" opacity=".85"/>
        <!-- eyes: white, gradient iris, pupil, highlights, lids and lashes -->
        <ellipse cx="94" cy="143" rx="14" ry="17" fill="#fff" stroke="none"/>
        <ellipse cx="146" cy="143" rx="14" ry="17" fill="#fff" stroke="none"/>
        <g clip-path="url(#rin-eye-l)" stroke="none">
          <ellipse cx="95" cy="145" rx="12" ry="16" fill="url(#rin-iris)"/>
          <ellipse cx="95" cy="143" rx="5.5" ry="8" fill="#120707"/>
          <path d="M80 128 Q94 134 110 128 L110 124 L80 124 Z" fill="#8a7a7a" opacity=".45"/>
        </g>
        <g clip-path="url(#rin-eye-r)" stroke="none">
          <ellipse cx="145" cy="145" rx="12" ry="16" fill="url(#rin-iris)"/>
          <ellipse cx="145" cy="143" rx="5.5" ry="8" fill="#120707"/>
          <path d="M130 128 Q146 134 160 128 L160 124 L130 124 Z" fill="#8a7a7a" opacity=".45"/>
        </g>
        <g fill="#fff" stroke="none">
          <ellipse cx="89" cy="135" rx="5" ry="6.5"/><circle cx="101" cy="152" r="2.6"/><circle cx="87" cy="153" r="1.4" opacity=".8"/>
          <ellipse cx="139" cy="135" rx="5" ry="6.5"/><circle cx="151" cy="152" r="2.6"/><circle cx="137" cy="153" r="1.4" opacity=".8"/>
        </g>
        <path d="M78 131 Q94 118 112 128" fill="none" stroke-width="5"/>
        <path d="M128 128 Q146 118 162 131" fill="none" stroke-width="5"/>
        <path d="M79 132 L71 127 M80 136 L73 137 M161 132 L169 127 M160 136 L167 137" fill="none" stroke-width="2.4"/>
        <path d="M87 159 Q95 162 103 159 M137 159 Q145 162 153 159" fill="none" stroke-width="1.4"/>
        <!-- blush with manga hatching, plaster, nose, fanged grin -->
        <ellipse cx="80" cy="168" rx="11" ry="5" fill="#e98d86" stroke="none" opacity=".5"/>
        <ellipse cx="160" cy="168" rx="11" ry="5" fill="#e98d86" stroke="none" opacity=".5"/>
        <path d="M73 169 l4 -6 M79 170 l4 -6 M85 171 l4 -6 M153 171 l4 -6 M159 170 l4 -6 M165 169 l4 -6" stroke="#c1272d" stroke-width="1.3"/>
        <g transform="rotate(-20 158 178)"><rect x="148" y="174" width="20" height="9" rx="3.5" fill="#ffd9a8" stroke-width="1.6"/>
          <circle cx="155" cy="178.5" r=".9" fill="#c98a55" stroke="none"/><circle cx="161" cy="178.5" r=".9" fill="#c98a55" stroke="none"/></g>
        <path d="M121 162 l-2 5" fill="none" stroke-width="1.6"/>
        <path d="M109 176 Q120 190 131 176 Q120 181 109 176 Z" fill="#9e1b21"/>
        <path d="M114 181 Q120 186 126 181 Q120 183 114 181 Z" fill="#e98d86" stroke="none"/>
        <path d="M113 177 l2 4 l2 -3.5" fill="#fff" stroke-width="1.2"/>
        <!-- spiky layered bangs and side locks -->
        <path d="M58 110 Q50 160 66 198 Q72 182 74 152 Q72 130 68 116 Z" fill="url(#rin-bangs)"/>
        <path d="M182 110 Q190 160 174 198 Q168 182 166 152 Q168 130 172 116 Z" fill="url(#rin-bangs)"/>
        <path d="M66 198 Q64 186 68 178 L73 180 Z M174 198 Q176 186 172 178 L167 180 Z" fill="#c1272d" stroke-width="1.4"/>
        <path d="M56 128 Q50 58 120 46 Q190 58 184 128 L178 132 Q174 112 164 102 L162 124 Q152 108 142 100 L138 122 Q130 106 124 98 L116 120 Q108 106 100 100 L96 122 Q88 108 80 102 L78 126 Q70 112 64 106 L60 134 Z" fill="url(#rin-bangs)"/>
        <path d="M100 62 Q95 80 100 92 M140 62 Q145 80 140 92 M120 56 Q117 72 121 86" fill="none" stroke="#1a1238" stroke-width="1.4" opacity=".7"/>
        <path d="M76 78 Q120 54 164 78" fill="none" stroke="#fff" stroke-width="5" opacity=".35" stroke-dasharray="16 7"/>
        <!-- brows drawn over the fringe, anime-style -->
        <path d="M81 113 Q93 107 106 111 M134 111 Q147 107 159 113" fill="none" stroke-width="2.4" opacity=".85"/>
        <!-- goggles pushed up on her head -->
        <path d="M54 100 Q120 34 186 100" fill="none" stroke="#3a2b22" stroke-width="8"/>
        <path d="M114 60 L126 60" stroke="#8b929e" stroke-width="5"/>
        <circle cx="100" cy="60" r="15" fill="url(#rin-lens)" stroke="#c9ced6" stroke-width="4.5"/>
        <circle cx="140" cy="60" r="15" fill="url(#rin-lens)" stroke="#c9ced6" stroke-width="4.5"/>
        <path d="M92 55 Q96 49 103 49 M132 55 Q136 49 143 49" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>
      </g>
      <text x="162" y="275" font-family="Russo One, sans-serif" font-size="9.5" text-anchor="middle" fill="#151515">RIN</text>
      
    </symbol>
    <symbol id="sakura" viewBox="0 0 12 12"><g fill="#c1272d"><circle cx="6" cy="2.6" r="2.4"/><circle cx="9.3" cy="5" r="2.4"/><circle cx="8" cy="9" r="2.4"/><circle cx="4" cy="9" r="2.4"/><circle cx="2.7" cy="5" r="2.4"/></g><circle cx="6" cy="6" r="1.3" fill="#efe8dc"/></symbol>
    <symbol id="branch" viewBox="0 0 190 170">
      <path d="M190 120 Q150 108 128 84 Q104 58 70 50 Q40 44 12 12 M128 84 Q138 50 124 22 M96 62 Q84 88 92 118 M70 50 Q60 30 44 24" fill="none" stroke="#151515" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#sakura" x="116" y="12" width="15" height="15"/><use href="#sakura" x="36" y="16" width="12" height="12"/>
      <use href="#sakura" x="84" y="108" width="15" height="15"/><use href="#sakura" x="140" y="96" width="13" height="13"/>
      <use href="#sakura" x="60" y="40" width="11" height="11"/><use href="#sakura" x="6" y="4" width="10" height="10"/>
      <use href="#sakura" x="104" y="60" width="9" height="9"/><use href="#sakura" x="166" y="104" width="11" height="11"/>
      <circle cx="30" cy="80" r="2.2" fill="#c1272d"/><circle cx="150" cy="150" r="2" fill="#c1272d"/><circle cx="60" cy="140" r="1.8" fill="#c1272d"/>
    </symbol>
    <!-- line-art mid-engine coupe, side profile -->
    <symbol id="car" viewBox="0 0 360 130">
      <path d="M40 116 Q180 104 330 116 Q180 128 40 116 Z" fill="#151515" opacity=".85"/>
      <g stroke="#151515" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M14 92 L20 78 Q60 70 120 62 L170 38 Q200 34 232 36 L286 54 L324 58 L326 46 L352 45 L350 55 L353 88 L346 99 L310 99 A28 28 0 0 0 254 99 L110 99 A28 28 0 0 0 54 99 L18 99 Z" fill="#f7f2e9"/>
        <path d="M136 62 L172 42 L228 40 L256 54 L250 62 Z" fill="#151515"/>
        <path d="M204 41 L206 62" stroke="#f7f2e9" stroke-width="2"/>
        <path d="M150 64 L152 97 M232 70 Q246 66 258 72 L256 86 Q244 81 232 85 Z" fill="none"/>
        <path d="M22 80 L44 76" stroke-width="3"/>
        <path d="M100 82 L300 80" stroke-width="1.2" opacity=".6"/>
        <circle cx="82" cy="99" r="23" fill="#151515"/><circle cx="82" cy="99" r="15" fill="#f7f2e9"/>
        <circle cx="282" cy="99" r="23" fill="#151515"/><circle cx="282" cy="99" r="15" fill="#f7f2e9"/>
        <path d="M82 84 L82 114 M67 99 L97 99 M71 88 L93 110 M93 88 L71 110 M282 84 L282 114 M267 99 L297 99 M271 88 L293 110 M293 88 L271 110" stroke-width="1.6"/>
        <circle cx="82" cy="99" r="4" fill="#c1272d"/><circle cx="282" cy="99" r="4" fill="#c1272d"/>
      </g>
      <path d="M332 62 L351 62" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
    </symbol>
  </svg>

  <header class="top">
    <a class="brand" href="#/">
      <span class="sign" title="Seibi: Japanese for maintenance">整備</span>
      <span class="words"><b>VEHICLE TRACKER</b><span>JDM GARAGE · EST. 2026</span></span>
    </a>
    <span id="demo-badge" class="demo-badge" hidden>Demo data</span>
    <button id="sync-badge" class="sync-badge" hidden title="Tap to retry"></button>
    <span class="spacer"></span>
    <a class="btn" href="/calendar.ics" title="Import or subscribe in Calendar">Calendar</a>
    <button id="add-btn">+ Add vehicle</button>
    <button id="chat-btn" class="primary">Ask Rin</button>
  </header>

  <main id="app"></main>

  <aside id="chat">
    <div class="chat-head">
      <span class="avatar"><svg viewBox="50 34 140 140"><use href="#rin" width="240" height="300"/></svg></span>
      <span class="who"><b>Rin</b><span>● ON SHIFT · MECHANIC</span></span>
      <span class="spacer"></span>
      <button class="ghost" id="chat-new" title="Start a new conversation">New</button>
      <button class="ghost" id="chat-close" title="Close">✕</button>
    </div>
    <div class="log" id="chat-log"></div>
    <label class="check chat-ctx" id="chat-ctx-row" hidden><input type="checkbox" id="chat-ctx" checked>
      When asking Claude or ChatGPT, include my garage summary (makes, models, due dates, advisories; never plates, policy numbers or personal details)</label>
    <form id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Ask Rin, or tell her what work you've done…"></textarea>
      <button class="primary" type="submit" id="chat-send">Send</button>
    </form>
  </aside>

  <input type="file" id="scan-input" accept="image/*,application/pdf" hidden>
  <dialog id="dialog"></dialog>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
